[project]
name = "poets-catalog"
version = "0.1.0"
description = "PostgreSQL catalog and repeatable importer for chinese-poetry"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "opencc-python-reimplemented>=0.1.7,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[project.scripts]
poets-import = "poets_catalog.importer:main"
poets-admin = "poets_catalog.admin.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
